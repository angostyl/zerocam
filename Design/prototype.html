<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroCam iOS — Interactive Concept Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #09090b;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 20px;
    }
    .header-info {
      text-align: center;
      margin-bottom: 24px;
      max-width: 600px;
    }
    .badge-tag {
      display: inline-block;
      background: rgba(245, 197, 24, 0.15);
      color: #F5C518;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 4px 12px;
      border-radius: 12px;
      margin-bottom: 10px;
    }
    h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; letter-spacing: -0.5px; }
    p.sub { color: #888892; font-size: 13px; line-height: 1.4; }

    /* Switcher de Ecrãs */
    .screen-switcher {
      display: flex;
      gap: 8px;
      background: #141418;
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .screen-btn {
      background: transparent;
      border: none;
      color: #888892;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .screen-btn.active {
      background: #F5C518;
      color: #000;
    }

    /* iPhone 16 Pro Container */
    .phone-wrapper {
      width: 393px;
      height: 852px;
      background: #000;
      border-radius: 54px;
      border: 3px solid #28282c;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* Dynamic Island */
    .island {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 125px;
      height: 35px;
      background: #000;
      border-radius: 20px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 12px;
    }
    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #111;
      border: 1px solid #222;
    }
    /* Status Bar */
    .status-bar {
      height: 48px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 32px 6px;
      font-size: 13px;
      font-weight: 600;
      z-index: 90;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 10px 16px 20px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
      margin-bottom: 12px;
    }
    .recipe-capsule {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.12);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .recipe-capsule .dot { width: 7px; height: 7px; border-radius: 50%; background: #F5C518; }
    .mode-toggle {
      display: flex;
      background: rgba(255,255,255,0.08);
      padding: 3px;
      border-radius: 16px;
      gap: 2px;
    }
    .mode-btn {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #F5C518;
      color: #000;
    }
    .round-action {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
    }

    /* Viewfinder */
    .viewfinder {
      width: 361px;
      height: 481px;
      border-radius: 18px;
      background: #15161a;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      background-size: cover;
      background-position: center;
    }
    .viewfinder.portra {
      background: linear-gradient(135deg, #2c2824 0%, #171618 100%);
    }
    .viewfinder.chrome {
      background: linear-gradient(135deg, #1b2426 0%, #0e1214 100%);
    }
    .viewfinder.trix {
      background: linear-gradient(135deg, #2a2a2a 0%, #080808 100%);
    }
    .grid-lines {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      pointer-events: none;
    }
    .grid-cell { border: 0.5px dashed rgba(255,255,255,0.12); }
    .focus-reticle {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      border: 1.5px solid #F5C518;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .focus-reticle::after {
      content: '';
      width: 4px;
      height: 4px;
      background: #F5C518;
      border-radius: 50%;
    }
    .lens-selector {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 4px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .lens-btn {
      width: 42px;
      height: 28px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
    }
    .lens-btn.active {
      background: #F5C518;
      color: #000;
    }

    /* Controles Inferiores */
    .controls-panel {
      margin-top: 14px;
      background: rgba(255,255,255,0.05);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .ev-slider-track {
      flex: 1;
      height: 3px;
      background: rgba(255,255,255,0.2);
      margin: 0 16px;
      border-radius: 2px;
      position: relative;
    }
    .ev-thumb {
      position: absolute;
      top: 50%;
      left: 58%;
      transform: translate(-50%, -50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #F5C518;
      cursor: pointer;
    }

    /* Barra de Disparo */
    .shutter-bar {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px 10px;
    }
    .gallery-thumb {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: #1c1d22;
      border: 1.5px solid rgba(255,255,255,0.3);
      position: relative;
      cursor: pointer;
    }
    .gallery-thumb .raw-tag {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: #F5C518;
      color: #000;
      font-size: 8px;
      font-weight: 900;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .shutter-btn {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      border: 3.5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    .shutter-btn:active { transform: scale(0.92); }
    .shutter-inner {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #fff;
    }
    .status-text-box {
      width: 54px;
      text-align: center;
    }
    .status-recipe { color: #F5C518; font-size: 10px; font-weight: 800; font-family: monospace; }
    .status-raw { color: #888892; font-size: 8px; font-weight: 700; font-family: monospace; }

    /* Home bar */
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 140px;
      height: 5px;
      background: rgba(255,255,255,0.6);
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="header-info">
    <div class="badge-tag">CONCEITO FIGMA • ZEROCAM IOS</div>
    <h1>ZeroCam — Pure Optical Film Camera</h1>
    <p class="sub">Simulador interativo de captura mono-frame Bayer RAW sem algoritmos computacionais agressivos da Apple.</p>
  </div>

  <div class="screen-switcher">
    <button class="screen-btn active" onclick="switchMode('auto')">01 · Auto EV</button>
    <button class="screen-btn" onclick="switchMode('pro')">02 · Pro Manual</button>
    <button class="screen-btn" onclick="switchMode('recipes')">03 · Emulsões de Filme</button>
  </div>

  <!-- Telefone Mockup -->
  <div class="phone-wrapper">
    <div class="island"><div class="camera-lens"></div></div>
    <div class="status-bar">
      <span>9:41</span>
      <span>5G  100%</span>
    </div>

    <div class="content-area">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="recipe-capsule" onclick="switchMode('recipes')">
          <span class="dot"></span>
          <span id="currentRecipeTitle">PORTRA 400</span>
          <span style="font-size: 8px; color:#F5C518;">▼</span>
        </div>

        <div class="mode-toggle">
          <div class="mode-btn active" id="btnAuto" onclick="switchMode('auto')">AUTO</div>
          <div class="mode-btn" id="btnPro" onclick="switchMode('pro')">PRO</div>
        </div>

        <div class="round-action" style="color:#F5C518;">⚡</div>
        <div class="round-action">ℹ</div>
      </div>

      <!-- Viewfinder 3:4 -->
      <div class="viewfinder portra" id="vfView">
        <div class="grid-lines">
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
          <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        </div>
        <div class="focus-reticle"></div>
        <div class="lens-selector">
          <div class="lens-btn" onclick="setLens(this)">0.5</div>
          <div class="lens-btn active" onclick="setLens(this)">1x</div>
          <div class="lens-btn" onclick="setLens(this)">2x</div>
          <div class="lens-btn" onclick="setLens(this)">5x</div>
        </div>
      </div>

      <!-- Controls Panel (EV vs PRO) -->
      <div class="controls-panel" id="controlsPanel">
        <span style="font-size:11px; font-weight:800; color:#888892;">EV</span>
        <div class="ev-slider-track">
          <div class="ev-thumb"></div>
        </div>
        <span style="font-size:12px; font-weight:800; color:#F5C518;">+0.3</span>
      </div>

      <!-- Shutter Action Bar -->
      <div class="shutter-bar">
        <div class="gallery-thumb">
          <div class="raw-tag">RAW</div>
        </div>
        <div class="shutter-btn" onclick="triggerShutter()">
          <div class="shutter-inner"></div>
        </div>
        <div class="status-text-box">
          <div class="status-recipe" id="statusRecipeTag">PORTRA</div>
          <div class="status-raw">14-BIT RAW</div>
        </div>
      </div>
    </div>

    <div class="home-bar"></div>
  </div>

  <script>
    function switchMode(mode) {
      const btnAuto = document.getElementById('btnAuto');
      const btnPro = document.getElementById('btnPro');
      const panel = document.getElementById('controlsPanel');
      const btns = document.querySelectorAll('.screen-btn');

      btns.forEach(b => b.classList.remove('active'));

      if (mode === 'auto') {
        btns[0].classList.add('active');
        btnAuto.classList.add('active');
        btnPro.classList.remove('active');
        panel.innerHTML = `
          <span style="font-size:11px; font-weight:800; color:#888892;">EV</span>
          <div class="ev-slider-track"><div class="ev-thumb"></div></div>
          <span style="font-size:12px; font-weight:800; color:#F5C518;">+0.3</span>
        `;
      } else if (mode === 'pro') {
        btns[1].classList.add('active');
        btnAuto.classList.remove('active');
        btnPro.classList.add('active');
        panel.innerHTML = `
          <div style="display:flex; flex-direction:column; width:100%; gap:8px;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <span style="font-size:14px; font-weight:900; color:#F5C518; font-family:monospace;">ISO 160</span>
              <span style="font-size:10px; color:#888892; font-family:monospace;">50 · 100 · [160] · 200 · 400</span>
            </div>
            <div style="font-size:10px; color:rgba(255,255,255,0.7); font-family:monospace;">
              1/500s • f/1.78 • 24mm • 5600K
            </div>
          </div>
        `;
      } else if (mode === 'recipes') {
        btns[2].classList.add('active');
        alert("Receitas ativas no conceito: Kodak Portra 400, Fujifilm Classic Chrome, Kodak Tri-X 400 e Process Zero (Bayer RAW).");
      }
    }

    function setLens(el) {
      document.querySelectorAll('.lens-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function triggerShutter() {
      const vf = document.getElementById('vfView');
      vf.style.opacity = '0.3';
      setTimeout(() => { vf.style.opacity = '1'; }, 100);
    }
  </script>
</body>
</html>
