name: Build ZeroCam iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package ZeroCam IPA
    runs-on: macos-latest # Runner padrão oficial do GitHub com Xcode pré-instalado

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen

      - name: Gerar Projeto Xcode
        run: |
          if [ -d "ios-app" ]; then cd ios-app; fi
          xcodegen generate --spec project.yml

      - name: Compilar App iOS (Release / Sem Assinatura)
        run: |
          if [ -d "ios-app" ]; then cd ios-app; fi
          set -o pipefail
          xcodebuild clean build \
            -project ZeroCam.xcodeproj \
            -scheme ZeroCam \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee xcodebuild.log || (
              echo "### Erro no xcodebuild" >> $GITHUB_STEP_SUMMARY
              echo '```text' >> $GITHUB_STEP_SUMMARY
              grep -i -C 3 -E "error:|fatal error:|fail" xcodebuild.log | head -n 40 >> $GITHUB_STEP_SUMMARY
              tail -n 30 xcodebuild.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            )

      - name: Empacotar IPA para Sideloadly / AltStore
        run: |
          if [ -d "ios-app" ]; then cd ios-app; fi
          mkdir -p Payload
          APP_PATH=$(find build -name "ZeroCam.app" -type d | head -n 1)
          echo "ZeroCam.app localizado em: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -qr ZeroCam.ipa Payload

      - name: Disponibilizar ZeroCam.ipa para Download
        uses: actions/upload-artifact@v4
        with:
          name: ZeroCam-iOS-IPA
          path: |
            ZeroCam.ipa
            ios-app/ZeroCam.ipa
          retention-days: 14
