name: Build ZeroCam iOS (.IPA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package ZeroCam IPA
    runs-on: macos-latest # Runner padrão oficial do GitHub com Xcode pré-instalado

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: |
          brew install xcodegen

      - name: Gerar Projeto Xcode
        run: |
          if [ -d "ios-app" ]; then cd ios-app; fi
          xcodegen generate --spec project.yml

      - name: Compilar App iOS (Release / Sem Assinatura)
        run: |
          if [ -d "ios-app" ]; then cd ios-app; fi
          xcodebuild clean archive \
            -project ZeroCam.xcodeproj \
            -scheme ZeroCam \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ZeroCam.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Empacotar IPA para Sideloadly / AltStore
        run: |
          if [ -d "ios-app" ]; then cd ios-app; fi
          mkdir -p Payload
          cp -r build/ZeroCam.xcarchive/Products/Applications/ZeroCam.app Payload/
          zip -qr ZeroCam.ipa Payload

      - name: Disponibilizar ZeroCam.ipa para Download
        uses: actions/upload-artifact@v4
        with:
          name: ZeroCam-iOS-IPA
          path: |
            ZeroCam.ipa
            ios-app/ZeroCam.ipa
          retention-days: 14
